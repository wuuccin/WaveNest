# WaveNest 组装层配置。★ 本文件只放连接与占位，不含业务参数。
# 中间件连接信息对应 deploy/docker-compose.yml 起的那四件套（演示期本机 compose 全起）。
server:
  port: 8080

spring:
  application:
    name: wavenest
  profiles:
    # 仿真 profile：数据源走 m1 的 Sim 连接器，不连真实 AIS/气象
    active: sim
  # 个人本地覆盖：端口/口令/profile 等差异化配置写在这里，本文件已被 .gitignore 忽略，
  # 每个人各有一份、永不入库；不存在时 skip，不影响 clone 即跑。
  # 两条路径分别对应「仓库根目录启动」与「wl-app 模块目录启动（bootRun）」两种习惯。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./backend/wl-app/application-local.yml
  datasource:
    # characterEncoding 必须填 Java 字符集名（utf8），不能填 MySQL 字符集名（utf8mb4）——
    # Connector/J 8.x 会把 utf8 自动映射到服务端的 utf8mb4；写 utf8mb4 会直接抛
    # "Unsupported character encoding 'utf8mb4'" 而连不上库。
    # allowPublicKeyRetrieval + useSSL=false：MySQL 8 默认 caching_sha2_password，
    # 非 SSL 连接需允许取公钥，否则报 "Public Key Retrieval is not allowed"。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/wavenest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:wavenest}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# MQTT broker：演示期 m1 可不起 Mosquitto，由仿真器直发业务 MQ
wavenest:
  mq:
    exchange: wavenest.data
    data-ais-queue: wavenest.m2.data.ais
    data-uav-queue: wavenest.m4.data.uav.telemetry
    task-plan-queue: wavenest.m4.task.plan
  telemetry:
    # Values are pending approval; supply all seven before enabling live ingest.
    enabled: ${TELEMETRY_ENABLED:false}
    max-speed-ms: ${UAV_MAX_SPEED_MS:}
    max-altitude-m: ${UAV_MAX_ALTITUDE_M:}
    max-vertical-rate-ms: ${UAV_MAX_VERTICAL_RATE_MS:}
    max-acceleration-ms2: ${UAV_MAX_ACCELERATION_MS2:}
    max-turn-rate-deg-sec: ${UAV_MAX_TURN_RATE_DEG_SEC:}
    sampling-ms: ${UAV_SAMPLING_MS:}
    speed-mad-threshold: ${UAV_SPEED_MAD_THRESHOLD:}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    host: ${MQTT_HOST:127.0.0.1}
    port: ${MQTT_PORT:1883}

logging:
  level:
    root: INFO
    com.waterlogistics: INFO
