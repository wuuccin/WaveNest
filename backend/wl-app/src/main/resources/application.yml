# WaveNest 组装层配置。★ 本文件只放连接与占位，不含业务参数。
# 中间件连接信息对应 deploy/docker-compose.yml 起的那四件套（演示期本机 compose 全起）。
server:
  port: 8080

spring:
  application:
    name: wavenest
  profiles:
    # 仿真 profile：数据源走 m1 的 Sim 连接器，不连真实 AIS/气象
    active: sim
  # 个人本地覆盖：端口/口令/profile 等差异化配置写在这里，本文件已被 .gitignore 忽略，
  # 每个人各有一份、永不入库；不存在时 skip，不影响 clone 即跑。
  # 两条路径分别对应「仓库根目录启动」与「wl-app 模块目录启动（bootRun）」两种习惯。
  #
  # ★ 注意：下面两条 import 不看 profile，是「存在即无条件加载」并会覆盖本文件的同名键。
  #   所以业务参数（尤其 wavenest.m2.prediction.bbox.*）一律不要写进 application-local.yml，
  #   否则本文件改了什么都会被本机悄悄盖掉，端到端验证会在旧值上跑而不自知
  #   （2026-10-27 T1-8 本地验证即如此：日志打印的框与仓库存量值不一致）。只在本地放端口/口令。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./backend/wl-app/application-local.yml
  datasource:
    # characterEncoding 必须填 Java 字符集名（utf8），不能填 MySQL 字符集名（utf8mb4）——
    # Connector/J 8.x 会把 utf8 自动映射到服务端的 utf8mb4；写 utf8mb4 会直接抛
    # "Unsupported character encoding 'utf8mb4'" 而连不上库。
    # allowPublicKeyRetrieval + useSSL=false：MySQL 8 默认 caching_sha2_password，
    # 非 SSL 连接需允许取公钥，否则报 "Public Key Retrieval is not allowed"。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/wavenest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:wavenest}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# MQTT broker：演示期 m1 可不起 Mosquitto，由仿真器直发业务 MQ
wavenest:
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    host: ${MQTT_HOST:127.0.0.1}
    port: ${MQTT_PORT:1883}

  m2:
    prediction:
      # T2-6 预测校验框定稿（全仓唯一装配配置）。
      # 零点＝《73-赣江场景说明》§3.1 的服务航段：朝阳大桥 28.646/115.852 → 八一大桥 28.692/115.879。
      # 船起点定稿 115.8611/28.6660（10-29 序号 2 拍板沿程 2.40 km；T2-7 已在 m1 仿真器侧生效）。
      # 不做四向对称：预测沿航向单向前伸，horizonSec=1800 s × 8 节 ⇒ 尾巴比船头远 7.408 km，
      # 而航段全长仅 5.78 km，故只在航向侧（东北）留一个时域行程，西南侧只罩住起点＋噪声。
      # 东北界取两条航向的包络（航段方位角 27.24°、仿真器现值 31.2°）后再留 0.5 km 缓冲；
      # 西南界离定稿起点 0.006°（≈666 m），而位置噪声是 ±0.00005°（5.5 m）级，余量足够抗微调。
      # ★ 已知边界：31.2° 的预测包络 lon 上界 115.921164 比东界多约 16 m ⇒ 船跑到 945 s 时整帧
      #   越界、回落匀速版。945 s 由「参考线 11310 m − 预测需求 7416 m」推导，不是笔误；
      #   演示口径 15 分钟内（900 拍末点 115.91998，仍余约 97 m），故演示不触发。
      #   本框不为「参考线被夹坏后的坏尾巴」放宽：拦成匀速版比放行 9 点重合的棒槌更好，
      #   真缺陷是参考线只在冷启动建一次（台账 §六 第 2 条，归 T3）。
      # 四个值必须与 PredictionBboxNanchangSegmentTest 的常量同值（该类有强制守卫）。
      bbox:
        min-lon: 115.857
        max-lon: 115.921
        min-lat: 28.660
        max-lat: 28.767

logging:
  level:
    root: INFO
    com.waterlogistics: INFO