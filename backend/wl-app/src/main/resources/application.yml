# WaveNest 组装层配置。★ 本文件只放连接与占位，不含业务参数。
# 中间件连接信息对应 deploy/docker-compose.yml 起的那四件套（演示期本机 compose 全起）。
server:
  port: 8080

spring:
  application:
    name: wavenest
  profiles:
    # 仿真 profile：数据源走 m1 的 Sim 连接器，不连真实 AIS/气象
    active: sim
  # 个人本地覆盖：端口/口令/profile 等差异化配置写在这里，本文件已被 .gitignore 忽略，
  # 每个人各有一份、永不入库；不存在时 skip，不影响 clone 即跑。
  # 两条路径分别对应「仓库根目录启动」与「wl-app 模块目录启动（bootRun）」两种习惯。
  #
  # ★ 注意：下面两条 import 不看 profile，是「存在即无条件加载」并会覆盖本文件的同名键。
  #   所以业务参数（尤其 wavenest.m2.prediction.bbox.*）一律不要写进 application-local.yml，
  #   否则本文件改了什么都会被本机悄悄盖掉，端到端验证会在旧值上跑而不自知
  #   （2026-10-27 T1-8 本地验证即如此：日志打印的框与仓库存量值不一致）。只在本地放端口/口令。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./backend/wl-app/application-local.yml
  datasource:
    # characterEncoding 必须填 Java 字符集名（utf8），不能填 MySQL 字符集名（utf8mb4）——
    # Connector/J 8.x 会把 utf8 自动映射到服务端的 utf8mb4；写 utf8mb4 会直接抛
    # "Unsupported character encoding 'utf8mb4'" 而连不上库。
    # allowPublicKeyRetrieval + useSSL=false：MySQL 8 默认 caching_sha2_password，
    # 非 SSL 连接需允许取公钥，否则报 "Public Key Retrieval is not allowed"。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/wavenest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:wavenest}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# MQTT broker：演示期 m1 可不起 Mosquitto，由仿真器直发业务 MQ
wavenest:
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    host: ${MQTT_HOST:127.0.0.1}
    port: ${MQTT_PORT:1883}

  # AIS 仿真：2026-11-09 起沿影像河心 13 点折线走；path-start-m 取南昌大桥附近的 2.40 km。
  # 未配置 path 时 SimAisConnector 回落到旧的起点+航向直线模式（单测仍用旧模式）。
  sim:
    ais:
      path: "115.844393,28.645998;115.847602,28.649634;115.850273,28.653512;115.854263,28.656665;115.858212,28.659247;115.857937,28.663776;115.858769,28.668476;115.860851,28.672213;115.862310,28.676931;115.864577,28.681114;115.866785,28.684879;115.869281,28.689080;115.872180,28.692014"
      path-start-m: 2400

  m2:
    prediction:
      # T2-6 预测校验框定稿（全仓唯一装配配置）。
      # 零点＝《73-赣江场景说明》§3.1 的服务航段：朝阳大桥 → 八一大桥。
      # 2026-11-09 几何校正：三桥锚点与 13 点中心线改按天地图影像河心重取（WGS-84），
      # 旧值（115.852/28.646、115.859/28.663、115.879/28.692）落在东岸，作废。
      # 船起点改为新中心线沿程 2.40 km 处 115.858005/28.662662（m1 仿真器按折线走）。
      # 不做四向对称：预测沿航向单向前伸，horizonSec=1800 s × 8 节 ⇒ 尾巴比船头远 7.408 km，
      # 而航段全长 6.00 km，故只在航向侧（东北）留一个时域行程，西南侧只罩住起点＋噪声。
      # 东北界取两条航向的包络（航段方位角 27.24°、旧直线口径 31.2°）后再留 0.5 km 缓冲；
      # 2026-11-09 起仿真船改走 13 点折线，31.2° 只作为旧直线口径的最坏包络保留。
      # ★ 已知边界：31.2° 的预测包络 lon 上界 115.921164 比东界多约 16 m ⇒ 船跑到 945 s 时整帧
      #   越界、回落匀速版。945 s 由「参考线 11310 m − 预测需求 7416 m」推导，不是笔误；
      #   演示口径 15 分钟内（900 拍末点 115.91998，仍余约 97 m），故演示不触发。
      #   本框不为「参考线被夹坏后的坏尾巴」放宽：拦成匀速版比放行 9 点重合的棒槌更好，
      #   真缺陷是参考线只在冷启动建一次（台账 §六 第 2 条，归 T3）。
      # 四个值必须与 PredictionBboxNanchangSegmentTest 的常量同值（该类有强制守卫）。
      bbox:
        min-lon: 115.840
        max-lon: 115.921
        min-lat: 28.640
        max-lat: 28.767
      # 11-07 弥补 D-17：中心线台账启动依赖档。required＝缺省（生产唯一许可档），
      # 应用启动期检查 centerline_point，缺表／无行／顶点不足／里程自检不过直接启动失败，
      # 异常文案给可直接执行的灌库命令；baseline＝显式降级，打 WARN 并改用下面的
      # centerline 配置串作内置基线，仅测试与本地联调可用，生产环境不得放宽。
      # 测试用 application-sim.yml（test resources）显式写 baseline；本地联调在
      # application-local.yml 或 -D 参数里显式写 baseline，不得靠"库里恰好没表"隐式降级。
      centerline-ledger-mode: required
      # 阶段二 2 真航道中心线：朝阳大桥 → 南昌大桥 → 八一大桥，按影像河心等弧长取 13 点，最大段约 524 m。
      # 2026-11-09 几何校正：坐标按天地图影像河心重取（WGS-84），旧 13 点（115.852/28.646 起）作废。
      # 锚点与 application.yml 的 admission.segment-vertices、004 桥中心、016 台账 v3 同源。
      # 留空则回落到「本船实测窗口建参考线」的退化口径。
      centerline: "115.844393,28.645998;115.847602,28.649634;115.850273,28.653512;115.854263,28.656665;115.858212,28.659247;115.857937,28.663776;115.858769,28.668476;115.860851,28.672213;115.862310,28.676931;115.864577,28.681114;115.866785,28.684879;115.869281,28.689080;115.872180,28.692014"
      # 分段限速（C7 裁定，见 77 §7）：沿中心线弧长 s（米）分区段给限速（米/秒）。
      # 每段「fromS,toS,speedMs」，段之间分号分隔；s 落在所有段之外不限速。
      # 留空＝全航段不限速（预测链路沿用现状）。
      # 当前生效值三段：前两段 4.5 m/s 高于实测 sog 4.12 m/s（不成为瓶颈）；
      # 末段 4000–6003.4 m 限 2.5 m/s 低于实测 sog——只有这样才能自证「限速确实生效」。
      # 末段上限取 6003.4：中心线台账 v3 十三点全长 6003.3510 m
      # （`016` 的 s_m 末行），写 6003.4 略高于总长，避免末点被「越界」判掉。
      segment-speed-limits: "0,2000,4.5;2000,4000,4.5;4000,6003.4,2.5"

    admission:
      # 阶段一 26 接单判定（AdmissionPipeline）的判据参数。台账化的服务航段表未建
      # （80 §5.5 待补），航段折线以《73》§3.1 定稿服务航段配置代替；建表后改读表。
      # 航段折线「lon,lat;lon,lat;…」：朝阳大桥 → 南昌大桥 → 八一大桥
      # 2026-11-09 与 prediction.centerline 的 1/6/13 点同源（影像河心重取）。
      segment-vertices: "115.844393,28.645998;115.857937,28.663776;115.872180,28.692014"
      segment-start-m: 0
      segment-end-m: 0            # 0＝取折线全长（服务航段＝整条演示航段）
      corridor-half-width-m: 50   # 走廊半宽：垂距超出即「不在段内」，与预测侧 lane-half-width-m 同源
      # 当前允许配送的品类显式子集，取值必须属于契约默认全集；
      # 显式留空或写入未知取值会在启动期失败，系统不静默过滤。
      cargo-whitelist: 医疗物资,应急药品,食品,生活物资
      max-payload-all-types-kg: 50.0
      max-payload-margin: 0.1     # 上界裕度：有效上界＝50×0.9＝45 kg
      ttl-ais-ms: 10000           # AIS 1 Hz，10 s 无有效观测即「数据不足」延后
      # 11-05 序号 2 修正：这里是无人机最大巡航速度，不是船速。此前取 6.0 是照船速上界
      # （sys_param.vMaxCraftMs）抄的，会让 etaMin 抬高 3.3 倍——船靠近航段末端时被
      # TIME_INFEASIBLE 误拒。与 sys_param.vMaxCruiseMs=20 同值。
      v-max-cruise-ms: 20.0
      t-handover-min-sec: 60
      wake-margin-sec: 60         # 等船唤醒提前量：tEnter − 60 s 唤醒
      suspend-retry-sec: 60       # 数据不足／未进段的重评周期
      horizon-sec: 1800           # 与预测侧 horizonSec 同源
      max-delivery-sec: 1800      # 系统 deadline 的业务上限：下单 + 本值 与 船驶出航段 取小
      weight-tol-kg: 0.5          # 重复单重量容差
      dup-window-sec: 300         # 重复单时间窗

logging:
  level:
    root: INFO
    com.waterlogistics: INFO