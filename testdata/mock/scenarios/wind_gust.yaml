# =====================================================================
# 场景家族 4/6：wind_gust（风突变扰动）
# 用途：20 min 离线子段，在 normal 三段限速之上叠加风突变扰动，
#       考察扰动期间预测误差与恢复段（扰动撤除后误差收敛）。
# 风突变幅度：wind_gust_ms = 3.0 m/s，为家族自造值——002_sys_param 头注
#       「尚无上游风况分布可依」，按契约 §13 标 design_assumption，
#       不得写成赣江实测阵风。
# 复跑：同 seed 复跑会撞唯一键，先清表或换 pred_version（契约 §9）。
# =====================================================================
family: wind_gust
seed: 4
mode: offline
t0_ms: 1794268800000
path_start_m: 1000.0
duration_sec: 1200
speed_limits_ms: "0,2000,4.5;2000,4000,4.5;4000,6003.4,2.5"
speed_profile: normal
tick_millis: 1000
truth_source: truth/wind_gust.csv
noise_deg: 0.00005
mmsi: "T4"
pred_version: 11090004
wind_gust_ms: 3.0             # 风突变幅度（m/s），家族自造值
param_sources:
  sog_ms: design_assumption
  speed_limits_ms: design_assumption
  speed_profile: design_assumption
  noise_deg: design_assumption
  sigmaEM: design_assumption
  tauESec: design_assumption
  alphaAlongMs: design_assumption
  tick_millis: design_assumption
  path_start_m: design_assumption
  中心线十三点: measured
  风突变幅度: design_assumption       # 002_sys_param 头注「尚无上游风况分布可依」
