# =====================================================================
# 场景家族 5/6：uav_low_battery（无人机低电量）
# 用途：20 min 离线子段，任务中段注入无人机电量下降至阈值以下，
#       考察低电量告警（AlertType.LOW_BATTERY）与返航优先策略下的预测链路。
# 阈值：uav_battery_low_pct = 20（%），家族自造值，标 design_assumption。
# 船侧参数与 normal 家族一致；扰动在机侧，不在船侧。
# 复跑：同 seed 复跑会撞唯一键，先清表或换 pred_version（契约 §9）。
# =====================================================================
family: uav_low_battery
seed: 5
mode: offline
t0_ms: 1794268800000
path_start_m: 1000.0
duration_sec: 1200
speed_limits_ms: "0,2000,4.5;2000,4000,4.5;4000,6003.4,2.5"
speed_profile: normal
tick_millis: 1000
truth_source: truth/uav_low_battery.csv
noise_deg: 0.00005
mmsi: "T5"
pred_version: 11090005
uav_battery_low_pct: 20       # 低电量阈值（%），家族自造值
param_sources:
  sog_ms: design_assumption
  speed_limits_ms: design_assumption
  speed_profile: design_assumption
  noise_deg: design_assumption
  sigmaEM: design_assumption
  tauESec: design_assumption
  alphaAlongMs: design_assumption
  tick_millis: design_assumption
  path_start_m: design_assumption
  中心线十三点: measured
  uav_battery_low_pct: design_assumption   # 家族自造阈值
