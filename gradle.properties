# ---- 注意：本机专属配置不要写在这里 ----
# 本文件会提交进仓库并同步到全组。像 org.gradle.java.home 这种写死本机路径的配置
# 一旦进来，队友机器上没有该路径就会直接构建失败。
# 要固定某台机器用哪个 JDK，写在个人 Gradle 家目录：
#   $GRADLE_USER_HOME/gradle.properties   （本机全局生效，不入库）
#
# 官方要求 JDK 17 起即可，编译目标由根构建脚本统一锁 17，混版 JDK 产物仍一致。

# ---- 编码 ----
# Windows 默认 GBK，源码含中文注释会报“不可映射的字符”。强制 UTF-8。
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx2g -XX:MaxMetaspaceSize=768m

# ---- 构建效率（九模块 monorepo）----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
